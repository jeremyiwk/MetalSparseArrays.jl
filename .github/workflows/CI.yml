name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # macOS runners only: the package depends on Metal.jl. GitHub's Apple Silicon
  # runners expose a Metal device, so device test sets are exercised when
  # DEVICE_AVAILABLE detects one; otherwise the guarded CPU-side suite still runs.
  test:
    name: Test — Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - '1.10' # oldest supported (see [compat] in Project.toml)
          - '1'    # latest stable release
        os:
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  aqua:
    name: Aqua QA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Run Aqua.test_all
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate(temp = true)
            Pkg.develop(path = ".")
            Pkg.add("Aqua")
            using Aqua, MetalSparseArrays
            Aqua.test_all(MetalSparseArrays)'

  format:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
