name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  # macOS runners only: the package depends on Metal.jl. GitHub's Apple Silicon
  # runners expose a Metal device, so device test sets are exercised when
  # DEVICE_AVAILABLE detects one; otherwise the guarded CPU-side suite still runs.
  test:
    name: Test — Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - '1.10' # oldest supported (see [compat] in Project.toml)
          - '1'    # latest stable release
        os:
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # Fail loudly if the Apple Silicon runner stops exposing a Metal device,
      # instead of green runs that silently skip every device test set.
      - uses: julia-actions/julia-runtest@v1
        env:
          CI_EXPECT_DEVICE: 'true'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  aqua:
    name: Aqua QA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # The piracies exception covers the one deliberate pirated method,
      # Adapt.adapt_storage(::Type{MtlArray}, ::SparseMatrixCSC) — the CUSPARSE
      # precedent, documented in its docstring in src/csc.jl.
      - name: Run Aqua.test_all and ExplicitImports
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate(temp = true)
            Pkg.develop(path = ".")
            Pkg.add(["Aqua", "ExplicitImports"])
            using Aqua, ExplicitImports, MetalSparseArrays, SparseArrays
            Aqua.test_all(
                MetalSparseArrays;
                piracies = (; treat_as_own = [SparseArrays.SparseMatrixCSC]),
            )
            check_no_implicit_imports(MetalSparseArrays)
            check_no_stale_explicit_imports(MetalSparseArrays)'

  format:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
