name: Docs

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write
  statuses: write

jobs:
  docs:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # On pull requests this only builds (deploydocs is a no-op), which gates
      # broken doctests and docstrings before merge; pushes to master deploy /dev
      # and tags deploy the versioned docs.
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          julia --project=docs --color=yes -e '
            using Pkg
            Pkg.develop(path = ".")
            Pkg.instantiate()'
          julia --project=docs --color=yes docs/make.jl
